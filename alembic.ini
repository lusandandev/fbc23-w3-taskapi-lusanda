[alembic]
# THe path to migration scripts
script_location = alembic

# Timestamp migration filenames
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Makes sure 'app' can be imported when running alembic from /app
prepend_sys_path = .

version_path_separator = os
output_encoding = utf-8

# Temporary placeholder, will be overridden at runtime from the DATABASE_URL environment variable
sqlalchemy.url = postgresql+psycopg://user:pass@localhost:5432/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S