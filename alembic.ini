[alembic]
# The directory containing migration scripts.
script_location = alembic

# Timestamp migration filenames for ordered, auditable schema changes.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Make sure the app package can be imported when Alembic runs from /app.
prepend_sys_path = .

version_path_separator = os
output_encoding = utf-8

# Placeholder; alembic/env.py replaces this with DATABASE_URL at runtime.
sqlalchemy.url = postgresql+psycopg://user:pass@localhost:5432/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S